{
  "schema_version": 1,
  "registry_id": "shujaa-owner-constraints",
  "constraints": [
    {
      "id": "SC-ASSUME-001",
      "status": "active",
      "scope": "codespace-action",
      "deny": [
        "unknown_evidence"
      ],
      "allowed_alternative": [
        "hold_and_verify"
      ],
      "authority": "owner",
      "reason": "Unverified assumptions are denied."
    },
    {
      "id": "SC-OWNER-001",
      "status": "active",
      "scope": "codespace-action",
      "deny": [
        "instruction_conflict",
        "scope_expansion"
      ],
      "allowed_alternative": [
        "request_owner_approval"
      ],
      "authority": "owner",
      "reason": "Owner instructions and scope cannot be overridden."
    },
    {
      "id": "SC-TOOL-001",
      "status": "active",
      "scope": "codespace-command",
      "deny": [],
      "conditional_allow": [
        {
          "commands": [
            "rg",
            "ripgrep"
          ],
          "purpose": "local_read_only_search",
          "required_evidence": [
            "search_read_only",
            "search_within_workspace",
            "search_within_task_scope",
            "no_sensitive_targets"
          ],
          "deny_options": [
            "--pre"
          ]
        }
      ],
      "allowed_alternative": [
        "grep",
        "find"
      ],
      "authority": "owner",
      "reason": "rg/ripgrep require scoped local read-only search."
    },
    {
      "id": "SC-OUTPUT-001",
      "status": "active",
      "scope": "codespace-output",
      "deny": [
        "oversized_terminal_output"
      ],
      "allowed_alternative": [
        "file_with_small_summary"
      ],
      "authority": "owner",
      "reason": "Oversized output must be delivered through a file."
    },
    {
      "id": "SC-SAVE-001",
      "status": "active",
      "scope": "save-claim",
      "deny": [
        "unverified_save_claim"
      ],
      "allowed_alternative": [
        "complete_save_receipt"
      ],
      "authority": "owner",
      "reason": "A save claim requires complete verification."
    },
    {
      "id": "SC-PROPOSAL-001",
      "status": "active",
      "scope": "proposal-execution",
      "deny": [
        "unapproved_proposal_execution"
      ],
      "allowed_alternative": [
        "explicit_owner_approval"
      ],
      "authority": "owner",
      "reason": "A proposal is not execution authority."
    },
    {
      "id": "SC-COMPLETION-001",
      "status": "active",
      "scope": "completion-claim",
      "deny": [
        "state_without_required_evidence",
        "ambiguous_completion_claim",
        "final_go_without_independent_verification"
      ],
      "allowed_alternative": [
        "hold_not_verified",
        "evidence_receipt"
      ],
      "authority": "owner",
      "reason": "Artifact state and provenance claims must follow the owner-approved lifecycle and evidence requirements.",
      "artifact_states": [
        "GENERATED",
        "WRITTEN_TO_CODESPACE",
        "TRACKED",
        "COMMITTED",
        "PUSHED",
        "VERIFIED"
      ],
      "coverage_states": [
        "VERIFIED",
        "PARTIAL",
        "NOT IMPLEMENTED",
        "BLOCKED"
      ],
      "evidence_requirements": {
        "save": [
          "path",
          "existence_and_content_verification",
          "tracked_status_when_git_required",
          "commit_and_push_status_when_required"
        ],
        "test": [
          "test_count",
          "exit_code"
        ],
        "push": [
          "local_head",
          "remote_head",
          "head_match"
        ],
        "audit_verdict": [
          "source_artifact",
          "evidence_references",
          "derived_verdict_persisted_separately_or_clearly_appended"
        ],
        "large_round_final_go": [
          "independent_codespace_completion_verification"
        ]
      },
      "documentation_update_cadence": [
        "milestone",
        "architecture_decision",
        "stage_state_change"
      ],
      "sandbox_is_not_codespace_evidence": true,
      "missing_evidence_result": "HOLD — NOT VERIFIED"
    },
    {
      "id": "SC-STATE-001",
      "status": "active",
      "scope": "state-closure",
      "deny": [
        "closure_with_active_state_drift",
        "stale_authoritative_mirror",
        "unreferenced_required_evidence"
      ],
      "allowed_alternative": [
        "reconcile_and_verify",
        "closure_pending"
      ],
      "authority": "owner",
      "reason": "Stage, slice, and milestone closure require synchronized active state and referenced evidence."
    }
  ]
}
